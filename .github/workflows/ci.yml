name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Core self-tests
        run: swift run dev-on-call-self-test
      - name: Build menu-bar app
        run: swift build -c release --product DevOnCall
      - name: Build companion CLI
        run: swift build -c release --product dev-on-call
      - name: Validate installer scripts
        run: bash -n scripts/install.sh scripts/install-local.sh scripts/package-app.sh
